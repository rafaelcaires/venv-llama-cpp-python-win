name: Qwen3 GGUF Local
version: 1.0.0
schema: v1

models:
  - name: Qwen3 1.7B - Chat
    provider: openai
    model: qwen3-1.7b
    apiBase: "http://localhost:8000/v1"
    apiKey: "local"
    roles:
      - chat
      - edit
      - apply
    requestOptions:
      timeout: 180
    defaultCompletionOptions:
      temperature: 0.1
      maxTokens: 256

  - name: Qwen3 1.7B - Autocomplete
    provider: openai
    model: qwen3-1.7b
    apiBase: "http://localhost:8000/v1"
    apiKey: "local"
    roles:
      - autocomplete
    requestOptions:
      timeout: 20
    defaultCompletionOptions:
      temperature: 0.0
      maxTokens: 64

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
