name: Qwen Coder GGUF Local
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder 3B - Chat
    provider: openai
    model: qwen2.5-coder-3b-instruct
    apiBase: "http://localhost:8000/v1"
    apiKey: "local"
    roles:
      - chat
      - edit
      - apply
    requestOptions:
      timeout: 120
    defaultCompletionOptions:
      temperature: 0.1
      maxTokens: 512

  - name: Qwen 2.5 Coder 3B - Autocomplete
    provider: openai
    model: qwen2.5-coder-3b-instruct
    apiBase: "http://localhost:8000/v1"
    apiKey: "local"
    roles:
      - autocomplete
    requestOptions:
      timeout: 30
    defaultCompletionOptions:
      temperature: 0.0
      maxTokens: 256

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
